<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cycle count · AFU</title>
<style>
  :root { --paper: #f7f9fc; --ink: #1b2230; --muted: #5a6478; color-scheme: light; }
  @media (prefers-color-scheme: dark) {
    :root { --paper: #12161e; --ink: #e6eaf2; --muted: #9aa4b8; color-scheme: dark; }
  }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--paper); color: var(--ink);
         font: 17px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { padding: 24px; text-align: center; }
  h1 { margin: 0 0 8px; font-size: 1.6rem; }
  p { margin: 0; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Cycle count</h1>
  <p>The counting app isn't live yet.</p>
</main>
</body>
</html>
